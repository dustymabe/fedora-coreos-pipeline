# additional_arches: [aarch64, ppc64le, s390x]
additional_arches: [ppc64le, s390x]

source_config:
  url: https://github.com/openshift/os
  ref: release-${STREAM}
  yumrepos: https://gitlab.cee.redhat.com/coreos/redhat-coreos.git


default_artifacts:
  aarch64:
    - aws
    - live
    - metal
    - metal4k
  ppc64le:
    - live
    - metal
    - metal4k
    - openstack
  s390x:
    - dasd
    - live
    - metal
    - metal4k
    - openstack
  x86_64:
    - aws
    - azure
    - gcp
    - live
    - metal
    - metal4k
    - openstack
    - vmware

# remove to disable S3 uploads
s3_bucket: rhcos-ci
# path: releases/4.11-devel

registry_repos:
  oscontainer: registry.ci.openshift.org/rhcos-devel/machine-os-content

default_artifacts:
  aarch64:
    - openstack
    - live
    - metal
    - metal4k
  ppc64le:
    - openstack
    - powervs
    - live
    - metal
    - metal4k
  s390x:
    - ibmcloud
    - openstack
    - live
    - metal
    - metal4k
  x86_64:
